<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="671" height="215" viewBox="0 0 671 215" role="img" aria-labelledby="title desc">
  <title id="title">P rectangular take-off</title>
  <desc id="desc">Technical side view with connection options matching the source drawing.</desc>

  <defs>
