  <g fill="#111" font-family="Arial, sans-serif">
    <text x="228" y="56" font-size="34" font-weight="700">EUROPROFIEL</text>
    <text x="205" y="82" font-size="9">Dubbel kaderprofiel / Profil double</text><text x="205" y="94" font-size="9">Double ductwork profile</text>
    <text x="205" y="119" font-size="9">Hoekstukken 2,5 en 3 mm dikte / Equerre massive ép. 2,5 et 3 mm</text><text x="205" y="131" font-size="9">Corner piece 2.5 and 3 mm thick</text>
    <text x="205" y="157" font-size="9">Klemming van de hoekstukken / Serrage equerre</text><text x="205" y="169" font-size="9">Clamping of corner piece</text>
    <text x="205" y="199" font-size="9">Elastisch blijvende dichting / Etanchéité souple</text><text x="205" y="211" font-size="9">Elastic seal</text>
    <text x="205" y="235" font-size="9">Aanslag luchtkanaal over hele omtrek / Butée gaine sur le contour entier</text><text x="205" y="247" font-size="9">Bump against the whole contour of the duct</text>
    <text x="334" y="277" font-size="9">Luchtkanaal / Gaine rectangulaire</text><text x="334" y="289" font-size="9">Rectangular duct</text>
    <text x="205" y="334" font-size="9">Klemdichting / Etanchéité par effet de serrage</text><text x="205" y="346" font-size="9">Airtightness ensured by clamping</text>
    <text x="205" y="370" font-size="9">Perfecte dichting kanaal in dichtingsmassa / Etanchéité parfaite gaine dans la masse d'étanchéité</text><text x="205" y="382" font-size="9">Perfect seal of duct in sealing mass</text>
  </g>
