<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="671" height="429" viewBox="0 0 671 429">
  <title>Luchtdichte kaderprofielen</title><desc>Editable schematic of a TDC airtight rectangular duct corner.</desc>
  <rect x="0" y="0" width="671" height="429" fill="#fff"/>
  <g id="corner-profile" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M60 139 V72 Q60 31 100 31 H163 Q181 31 181 45 Q181 60 163 60 H112 V331 H140 V347 H98 Q76 347 76 325 V90 H60 Z" fill="#999"/>
    <path d="M112 331 H154 Q164 331 170 326 H473 L466 333 L474 341 H169 Q160 355 140 355 H98 Q68 355 68 325 V139" fill="#999"/>
    <path d="M91 95 V316 Q91 338 110 338 H140" fill="none"/>
    <path d="M112 68 H91 V95 H112" fill="#999"/>
  </g>
  <g id="seal-airflow" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="7 5">
    <path d="M122 42 q28 22 5 53 q-17 25 4 39"/><path d="M136 40 q23 29 4 55 q-17 23 -4 40"/>
  </g>
  <g id="leaders" fill="none" stroke="#111" stroke-width="1.2">
    <path d="M253 267 H116 M362 282 L300 330"/>
    <path d="M116 267 l8 -4 v8 z M300 330 l4 -8 5 7 z" fill="#111" stroke="none"/>
