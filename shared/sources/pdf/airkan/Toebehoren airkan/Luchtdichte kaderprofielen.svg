  <g fill="#111" font-family="Arial, sans-serif">
    <text x="215" y="61" font-size="38" font-weight="700">TDC-PROFIEL</text>
    <text x="165" y="126" font-size="11">* Kanaal en kader vormen 1 geheel waardoor de luchtdichtheid automatisch verbetert.</text><text x="174" y="140" font-size="11">Nieuw kadersysteem compatibel met Airkan Europrofiel E20 en E30.</text>
    <text x="165" y="164" font-size="11">* Gaine rectangulaire et cadre, forment 1 unité qui améliore la densité de l'air automa</text><text x="174" y="178" font-size="11">tiquement. Nouveau système de cadre compatible avec des Europrofils d'Airkan E20 et E30.</text>
    <text x="165" y="202" font-size="11">* Rectangular duct and frame form 1 unit which improves the air density automatically.</text><text x="174" y="216" font-size="11">New frame system compatible with the Airkan Europrofiles E20 and E30.</text>
    <text x="151" y="263" font-size="11">Hoekstuk - Angle - Corner piece</text><text x="324" y="278" font-size="11">Luchtkanaal - Gaines rectangulaire - Rectangular duct</text>
  </g>
  <text id="designation" x="335.5" y="421" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="11.0" font-style="normal" font-weight="400" text-anchor="middle" text-decoration="none">Luchtdichte kaderprofielen</text>
</svg>
