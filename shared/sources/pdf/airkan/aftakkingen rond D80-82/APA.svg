            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="293" y="9"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">Ø2</text>
    </g>

    <g id="front-saddle-width">
      <path d="M 259 101 V 132" fill="none" stroke-width=".65"/>
      <path d="M 328 101 V 132" fill="none" stroke-width=".65"/>
      <path d="M 261 129 H 326"
            fill="none"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="293.5" y="126"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">Ø2 + 120</text>
    </g>

    <g id="side-branch-diameter">
      <path d="M 443 10 V 32" fill="none" stroke-width=".65"/>
      <path d="M 476 10 V 32" fill="none" stroke-width=".65"/>
      <path d="M 445 12 H 474"
            fill="none"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="459.5" y="9"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">Ø2</text>
    </g>

    <g id="side-main-diameter">
      <path d="M 398 154 V 178" fill="none" stroke-width=".65"/>
      <path d="M 478 154 V 178" fill="none" stroke-width=".65"/>
      <path d="M 400 177 H 476"
            fill="none"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="438" y="173"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">Ø1</text>
    </g>
