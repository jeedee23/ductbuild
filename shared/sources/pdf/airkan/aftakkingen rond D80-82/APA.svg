  <text id="part-name"
        x="337.5"
        y="198"
        fill="#111"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        text-anchor="middle">APA - Ø1 - Ø2</text>
</svg>
