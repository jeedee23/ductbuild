    <g id="front-height">
      <path d="M 201 35 H 273" fill="none" stroke-width=".65"/>
      <path d="M 201 72 H 224" fill="none" stroke-width=".65"/>
      <path d="M 201 151 H 224" fill="none" stroke-width=".65"/>
      <path d="M 201 37 V 70"
