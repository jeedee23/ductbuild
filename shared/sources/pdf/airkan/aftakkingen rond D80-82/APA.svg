            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle"
            transform="rotate(-90 197 53.5)">60</text>
      <text x="197" y="111.5"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle"
            transform="rotate(-90 197 111.5)">Ø1</text>
    </g>

    <g id="front-branch-diameter">
      <path d="M 276 10 V 32" fill="none" stroke-width=".65"/>
      <path d="M 310 10 V 32" fill="none" stroke-width=".65"/>
      <path d="M 278 12 H 308"
