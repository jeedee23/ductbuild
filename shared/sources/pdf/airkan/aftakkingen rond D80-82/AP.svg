      <path d="M 229 71 H 260" stroke-dasharray="5 3"/>
      <path d="M 329 71 H 356" stroke-dasharray="5 3"/>
      <path d="M 229 150 H 356" stroke-dasharray="5 3"/>
      <ellipse cx="229" cy="110" rx="8" ry="39" stroke-dasharray="5 3"/>
      <ellipse cx="356" cy="110" rx="8" ry="39" stroke-dasharray="5 3"/>
    </g>

    <g id="branch-front"
       fill="none"
       stroke="#111"
       stroke-width="1.5"
       stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M 278 35 H 311 V 51
               L 329 71 V 97 H 260 V 71
               L 278 51 Z"/>
      <path d="M 262 96 L 294.5 54 L 327 96"/>
      <path d="M 278 49 H 311"/>
      <path d="M 278 53 H 311"/>
    </g>

    <g id="front-centerlines"
