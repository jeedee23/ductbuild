    <g id="side-main-diameter">
      <path d="M 397 153 V 178" fill="none" stroke-width=".65"/>
      <path d="M 477 153 V 178" fill="none" stroke-width=".65"/>
      <path d="M 399 177 H 475"
            fill="none"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="437" y="173"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">Ø1</text>
