<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="305"
     height="205"
     viewBox="185 0 305 205">
  <title>AP - Ø1 - Ø2</title>
  <desc>Clean editable redraw of the AIRKAN centered circular branch technical drawing.</desc>

  <defs>
    <marker id="dimension-arrow"
