            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="294.5" y="125"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
