          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="400"
          text-anchor="start">Ø</text>
    <text x="25" y="52"
          fill="#8B5CF6"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="400"
