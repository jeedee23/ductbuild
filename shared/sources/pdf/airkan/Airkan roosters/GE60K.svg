<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="222" height="190" viewBox="0 0 222 190">
  <title>GE60K grille</title>
  <desc>Editable technical redraw of the AIRKAN GE60K framed grille.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 3 L 6 0 L 6 6 Z" fill="#8B5CF6" stroke="none"/>
    </marker>
  </defs>
  <rect id="background" x="0" y="0" width="222" height="190" fill="#fff" stroke="none"/>

  <g id="front-view">
    <rect x="22" y="23" width="142" height="100" fill="none" stroke="#111"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="39" y="40" width="108" height="66" fill="none" stroke="#111"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="frame-mitres" fill="none" stroke="#555" stroke-width="1"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 23 L 39 40"/>
      <path d="M 164 23 L 147 40"/>
      <path d="M 22 123 L 39 106"/>
      <path d="M 164 123 L 147 106"/>
    </g>
    <g id="vertical-supports" fill="none" stroke="#999" stroke-width=".65">
      <path d="M 60 40 V 106"/>
      <path d="M 81 40 V 106"/>
      <path d="M 104 40 V 106"/>
      <path d="M 125 40 V 106"/>
    </g>
    <g id="horizontal-blades" fill="none" stroke="#555" stroke-width="1"
       stroke-linecap="round">
      <path d="M 39 47 H 147"/>
      <path d="M 39 54 H 147"/>
      <path d="M 39 61 H 147"/>
      <path d="M 39 68 H 147"/>
      <path d="M 39 75 H 147"/>
      <path d="M 39 82 H 147"/>
      <path d="M 39 89 H 147"/>
      <path d="M 39 96 H 147"/>
      <path d="M 39 103 H 147"/>
    </g>
  </g>

  <g id="dimensions" fill="none" stroke="#8B5CF6">
    <path d="M 22 128 V 151 M 164 128 V 151" stroke-width=".65"/>
    <path d="M 24 147 H 162" stroke-width=".75"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 169 23 H 190 M 169 123 H 190" stroke-width=".65"/>
    <path d="M 186 25 V 121" stroke-width=".75"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g id="dimension-labels" fill="#8B5CF6" stroke="none"
     font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700"
     text-anchor="middle">
    <text x="93" y="144">B+28</text>
    <text x="183" y="73" transform="rotate(-90 183 73)">H+28</text>
  </g>

  <text id="designation" x="111" y="181" fill="#111" stroke="none"
        font-family="Arial, Helvetica, sans-serif" font-size="13"
        font-weight="700" text-anchor="middle">GE60K</text>
</svg>
