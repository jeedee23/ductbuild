<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="194"
     height="168"
     viewBox="0 0 194 168">
  <title>SL</title>
  <desc>Clean editable redraw of the AIRKAN SL compensator technical drawing.</desc>

  <defs>
    <marker id="dimension-arrow"
            markerWidth="6"
            markerHeight="6"
            refX="3"
            refY="3"
            orient="auto-start-reverse"
            markerUnits="strokeWidth">
      <path d="M 0 3 L 6 0 L 6 6 Z" fill="#8B5CF6" stroke="none"/>
    </marker>
  </defs>

  <rect id="background" x="0" y="0" width="194" height="168" fill="#fff" stroke="none"/>

  <g id="compensator"
     fill="none"
     stroke="#111"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M 93 38 H 101 V 113 H 93 Z" fill="none" stroke="#111" stroke-width="1.5"/>
    <path d="M 101 39
             L 105 37 L 109 39 L 113 37
             L 117 39 L 121 37 L 124 39"
          fill="none" stroke="#111" stroke-width="1.5"/>
    <path d="M 101 112
             L 105 114 L 109 112 L 113 114
             L 117 112 L 121 114 L 124 112"
          fill="none" stroke="#111" stroke-width="1.5"/>
    <path d="M 105 38 V 113 M 113 38 V 113 M 121 38 V 113"
          fill="none" stroke="#111" stroke-width="1.25"/>
    <path d="M 124 38 H 132 V 113 H 124 Z" fill="none" stroke="#111" stroke-width="1.5"/>
  </g>

  <g id="centerlines"
     fill="none"
     stroke="#999"
     stroke-width=".75"
     stroke-dasharray="10 3 2 3">
    <path d="M 88 75 H 137"
          fill="none" stroke="#999" stroke-width=".75" stroke-dasharray="10 3 2 3"/>
  </g>

  <g id="dimensions" fill="#8B5CF6" stroke="#8B5CF6">
    <g id="diameter">
      <path d="M 69 38 H 90" fill="none" stroke="#8B5CF6" stroke-width=".65"/>
      <path d="M 69 113 H 90" fill="none" stroke="#8B5CF6" stroke-width=".65"/>
      <path d="M 69 40 V 111"
            fill="none"
            stroke="#8B5CF6"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="63" y="75.5"
            fill="#8B5CF6"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle"
            transform="rotate(-90 63 75.5)">Ø</text>
    </g>

    <g id="plate-thickness">
      <path d="M 123 13 V 34" fill="none" stroke="#8B5CF6" stroke-width=".65"/>
      <path d="M 132 13 V 34" fill="none" stroke="#8B5CF6" stroke-width=".65"/>
      <path d="M 125 13 H 130"
            fill="none"
            stroke="#8B5CF6"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="127.5" y="9"
            fill="#8B5CF6"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">e</text>
    </g>

    <g id="length">
      <path d="M 93 117 V 136" fill="none" stroke="#8B5CF6" stroke-width=".65"/>
      <path d="M 132 117 V 136" fill="none" stroke="#8B5CF6" stroke-width=".65"/>
      <path d="M 95 133 H 130"
            fill="none"
            stroke="#8B5CF6"
            stroke-width=".75"
            marker-start="url(#dimension-arrow)"
            marker-end="url(#dimension-arrow)"/>
      <text x="112.5" y="129"
            fill="#8B5CF6"
            stroke="none"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            text-anchor="middle">110</text>
    </g>
  </g>

  <text id="designation-footer" x="97" y="157" fill="#111" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SL</text>
</svg>
